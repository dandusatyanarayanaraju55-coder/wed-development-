
<!DOCTYPE html>
<html>
<head>
<title>Smart Hospital Billing</title>
<style>
body {
    font-family: Arial;
    background: linear-gradient(120deg,#d4fcf7,#a6c1ee);
    margin: 0;
    padding: 25px;
}
.container {
    max-width: 450px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 20px #888;
}
h2 {
    text-align: center;
    color: #087f8c;
}
input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    box-sizing: border-box;
    border: 1px solid #aaa;
    border-radius: 7px;
}
button {
    width: 100%;
    padding: 12px;
    background: #087f8c;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}
button:hover {
    background: #04545c;
}
#result {
    margin-top: 20px;
    padding: 15px;
    background: #e5fff5;
    border-radius: 10px;
    display: none;
    line-height: 1.8;
}
</style>
</head>

<body>
<div class="container">

<h2>🏥 SMART HOSPITAL</h2>
<p style="text-align:center">Patient Billing & Classification</p>

<label>Patient Name</label>
<input type="text" id="name" placeholder="Enter patient name">

<label>Patient Category</label>
<select id="category">
<option value="General">General Patient</option>
<option value="Senior">Senior Citizen</option>
<option value="Student">Student</option>
</select>

<label>Consultation Charge (₹)</label>
<input type="number" id="consult" value="300" min="0">

<label>Diagnostic Charge (₹)</label>
<input type="number" id="diagnostic" value="500" min="0">

<label>Treatment Charge (₹)</label>
<input type="number" id="treatment" value="1000" min="0">

<label>Payment Amount (₹)</label>
<input type="number" id="payment" value="0" min="0">

<button onclick="calculateBill()">Generate Bill</button>

<div id="result"></div>
</div>

<script>
function calculateBill() {

let name = document.getElementById("name").value.trim();
let category = document.getElementById("category").value;

let c = Number(document.getElementById("consult").value);
let d = Number(document.getElementById("diagnostic").value);
let t = Number(document.getElementById("treatment").value);
let p = Number(document.getElementById("payment").value);

if (!name || [c,d,t,p].some(x => !Number.isFinite(x) || x < 0)) {
    alert("Enter valid patient and billing details!");
    return;
}

let total = c + d + t;
let discount = 0;

if (category === "Senior")
    discount = total * 0.20;
else if (category === "Student")
    discount = total * 0.10;

let finalBill = total - discount;

if (p > finalBill) {
    alert("Payment cannot exceed the final bill!");
    return;
}

let balance = finalBill - p;
let status = balance === 0 ? "Fully Paid" :
             p > 0 ? "Partially Paid" : "Unpaid";

let classification =
    balance === 0 ? "Paid Patient" :
    p > 0 ? "Partially Paid Patient" :
    "Pending Payment Patient";

let result = document.getElementById("result");
result.style.display = "block";

result.innerHTML = `
<h3>🧾 Patient Bill</h3>
<b>Patient:</b> ${name}<br>
<b>Category:</b> ${category}<br>
<b>Consultation:</b> ₹${c.toFixed(2)}<br>
<b>Diagnostics:</b> ₹${d.toFixed(2)}<br>
<b>Treatment:</b> ₹${t.toFixed(2)}<br>
<hr>
<b>Total Amount:</b> ₹${total.toFixed(2)}<br>
<b>Concession:</b> ₹${discount.toFixed(2)}<br>
<b>Final Bill:</b> ₹${finalBill.toFixed(2)}<br>
<b>Paid Amount:</b> ₹${p.toFixed(2)}<br>
<b>Balance:</b> ₹${balance.toFixed(2)}<br>
<b>Payment Status:</b> ${status}<br>
<b>Patient Classification:</b> ${classification}
`;
}
</script>
</body>
</html>
